name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-jsonstore
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist

      # Keep publishing in this workflow for the existing PyPI Trusted Publisher.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
